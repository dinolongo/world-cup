version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: worldcup-postgres
    environment:
      POSTGRES_DB: worldcup
      POSTGRES_USER: worldcup
      POSTGRES_PASSWORD: worldcup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldcup -d worldcup"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worldcup-network

volumes:
  postgres-data:
    driver: local

networks:
  worldcup-network:
    driver: bridge

